<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="5" y1="5" x2="35" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded plate -->
  <rect width="40" height="40" rx="9" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="0.5" y="0.5" width="39" height="39" rx="8.5" stroke="white" stroke-opacity="0.2"/>

  <!-- Top Server Unit -->
  <rect x="7" y="8" width="26" height="9" rx="3" fill="#0F172A" fill-opacity="0.6" stroke="white" stroke-opacity="0.8" stroke-width="1.2"/>
  <circle cx="11.5" cy="12.5" r="1.5" fill="#10B981"/>
