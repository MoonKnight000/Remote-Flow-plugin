  <line x1="21" y1="12.5" x2="29" y2="12.5" stroke="white" stroke-opacity="0.8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Bottom Server Unit -->
  <rect x="7" y="23" width="26" height="9" rx="3" fill="#0F172A" fill-opacity="0.6" stroke="white" stroke-opacity="0.8" stroke-width="1.2"/>
  <circle cx="11.5" cy="27.5" r="1.5" fill="#10B981"/>
  <circle cx="16" cy="27.5" r="1.5" fill="#A855F7"/>
  <line x1="21" y1="27.5" x2="29" y2="27.5" stroke="white" stroke-opacity="0.8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- High-speed Flow Arrows in between -->
  <path d="M16 17.5L14 19.5L16 21.5" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 22.5L26 20.5L24 18.5" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
